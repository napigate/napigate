[project]
name = "napigate"
version = "0.1.2"
description = "NapiGate: a config-driven Python API gateway with inline hooks and request monitoring."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["api-gateway", "proxy", "yaml", "monitoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
redis = [
    "redis[hiredis]>=5.0.0,<6.0.0",
]
postgres = [
    "psycopg[binary]>=3.2.0,<4.0.0",
]
grpc = [
    "grpcio>=1.72.0,<2.0.0",
    "grpcio-reflection>=1.72.0,<2.0.0",
    "protobuf>=5.29.0,<7.0.0",
]

[project.scripts]
napigate = "gateway.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gateway*"]
